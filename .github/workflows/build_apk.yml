name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Extract ZIP
        run: unzip BilliardAim_ready.zip -d project

      - name: Fix gradle.properties
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2g -Xms512m/' project/BilliardAim/gradle.properties

      - name: Make gradlew executable
        run: chmod +x project/BilliardAim/gradlew

      - name: Build Debug APK
        working-directory: project/BilliardAim
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAim-debug
          path: project/BilliardAim/app/build/outputs/apk/debug/app-debug.apk
