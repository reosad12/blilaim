name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP
        run: |
          unzip BilliardAim.zip -d extracted
          ls extracted

      - name: Set up Gradle
        run: |
          cd extracted/BilliardAim
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd extracted/BilliardAim
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAim-debug
          path: extracted/BilliardAim/app/build/outputs/apk/debug/app-debug.apk
          
