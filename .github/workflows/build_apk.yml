name: Build BilliardAim Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP
        run: unzip *.zip

      - name: Make gradlew executable
        run: chmod +x BilliardAim/gradlew

      - name: Build Debug APK
        run: cd BilliardAim && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: BilliardAim/app/build/outputs/apk/debug/app-debug.apk
