name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Unzip project
      run: unzip BilliardAim.zip -d .

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x BilliardAim/gradlew

    - name: Build debug APK
      run: cd BilliardAim && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: BilliardAim-debug
        path: BilliardAim/app/build/outputs/apk/debug/app-debug.apk
        
