name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: unzip BilliardAim.zip -d .
    - uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - run: chmod +x BilliardAim/gradlew
    - run: cd BilliardAim && ./gradlew assembleDebug
    - uses: actions/upload-artifact@v3
      with:
        name: BilliardAim-debug
        path: BilliardAim/app/build/outputs/apk/debug/app-debug.apk
        
