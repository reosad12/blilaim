name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Extract ZIP
        run: unzip BilliardAim_ready.zip -d project

      - name: Show extracted structure
        run: find project -type f | sort

      - name: Fix ALL gradle.properties
        run: |
          find project -name "gradle.properties" | while read f; do
            echo ">>> Fixing: $f"
            cat "$f"
            printf 'org.gradle.jvmargs=-Xmx2g -Xms512m\norg.gradle.daemon=false\n' > "$f"
            echo ">>> After fix:"
            cat "$f"
          done
          # Also fix ~/.gradle/gradle.properties if exists
          if [ -f "$HOME/.gradle/gradle.properties" ]; then
            printf 'org.gradle.jvmargs=-Xmx2g -Xms512m\norg.gradle.daemon=false\n' > "$HOME/.gradle/gradle.properties"
          fi

      - name: Make gradlew executable
        run: find project -name "gradlew" -exec chmod +x {} \;

      - name: Build Debug APK
        run: |
          GRADLEW=$(find project -name "gradlew" | head -1)
          PROJ_DIR=$(dirname "$GRADLEW")
          echo "Using gradlew: $GRADLEW"
          cd "$PROJ_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAim-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
